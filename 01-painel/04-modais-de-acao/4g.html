<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zataco — 4g</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:#e9e7e4;font-family:'Archivo',system-ui,sans-serif}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.45}}
a{color:var(--color-accent-700,#0b3fa1)}a:hover{color:var(--color-accent,#1560ec)}
.dv-turn{padding:40px 44px 32px;scroll-margin-top:16px}
.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;text-decoration:none}
.dv-tname{font:600 13px/1.2 'Archivo',sans-serif;color:#1a1a1a}
.dv-group{font:700 11px 'Archivo',sans-serif;letter-spacing:.14em;color:#6b6764;margin:34px 0 14px;border-top:1px solid rgba(0,0,0,.10);padding-top:10px;text-transform:uppercase}
.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}
.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.1);color:#1a1a1a;text-decoration:none}
.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'Archivo',sans-serif;color:rgba(0,0,0,.6)}
.dv-card{max-width:100%;background:#fff;border:1px solid rgba(0,0,0,.14);overflow:hidden}
.dv-opt:target .dv-oid{background:#1560ec;color:#fff}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.dv-card a{text-decoration:none}
:root{--color-accent:#1560ec;--color-accent-100:oklch(.95 .03 258);--color-accent-200:oklch(.9 .06 258);--color-accent-300:oklch(.82 .1 258);--color-accent-400:oklch(.68 .16 258);--color-accent-500:#1560ec;--color-accent-600:oklch(.5 .19 258);--color-accent-700:#0b3fa1;--color-accent-800:oklch(.32 .13 258);--color-accent-900:oklch(.25 .1 258)}
.dv-card table.table th{height:40px;padding-top:0;padding-bottom:0;vertical-align:middle;font-size:11px}
.dv-card table.table td{height:52px;padding:8px 12px;vertical-align:middle;font-size:14px}
.dv-card input.input{height:36px;box-sizing:border-box}
.btn-primary{background:#1560ec;border-color:#1560ec;color:#fff}
.btn-primary:hover{background:#0d3fa3}
.btn-primary:active{background:#0b3487}
</style>
</head>
<body style="padding:24px">
<div class="dv-opt" id="4g"><div class="dv-olabel"><a class="dv-oid" href="#4g">4g</a>Modal — Anexar foto ilustrativa (Designer · exibida ao operador na Estação)</div>
<div class="dv-card" style="width:820px;height:640px;background:#8a8580;display:flex;align-items:center;justify-content:center;position:relative">
  <div style="position:absolute;inset:0;background:rgba(32,30,29,.5)"></div>
  <div style="position:relative;width:600px;background:#fff;box-shadow:var(--shadow-lg,0 12px 40px rgba(0,0,0,.3))">
    <div style="display:flex;align-items:baseline;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(0,0,0,.10)"><span style="font:700 16px 'Archivo';color:#201e1d">Anexar foto ilustrativa — Item <span class="mono">BRC-100003-B</span></span><span style="font:600 16px 'Archivo';color:#6b6764"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:none"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span></div>
    <div style="padding:20px 24px;display:flex;flex-direction:column;gap:14px">
      <div style="border:1px dashed #a5a09b;padding:14px 16px;font:600 13px 'Archivo';color:#6b6764">Arraste a imagem ou · <a style="font-weight:700">escolher arquivo</a></div>
      <div style="display:flex;gap:14px;align-items:center"><div style="width:96px;height:96px;background:#e4e2df;display:flex;align-items:center;justify-content:center;font:600 9px 'Archivo';color:#8a8580;flex:none">PREVIEW</div><div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;align-items:center;gap:10px;border:1px solid rgba(0,0,0,.15);padding:10px 14px"><span class="mono" style="font-size:12.5px;font-weight:600">camiseta-polo-foto.jpg</span><span style="font:500 11px 'Archivo';color:#a5a09b">1,8 MB</span><a style="margin-left:auto;font:600 12px 'Archivo'">remover</a></div></div></div>
      <span style="font:500 12px 'Archivo';color:#6b6764">Exibida ao operador na Estação — a produção segue a arte e esta foto.</span>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;align-items:center;padding:14px 24px;border-top:1px solid rgba(0,0,0,.12)"><button class="btn btn-secondary">Cancelar</button><button class="btn btn-primary">Anexar foto</button></div>
  </div>
</div></div>
</body>
</html>
