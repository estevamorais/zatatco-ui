<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zataco — 1h</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:#e9e7e4;font-family:'Archivo',system-ui,sans-serif}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.45}}
a{color:var(--color-accent-700,#0b3fa1)}a:hover{color:var(--color-accent,#1560ec)}
.dv-turn{padding:40px 44px 32px;scroll-margin-top:16px}
.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;text-decoration:none}
.dv-tname{font:600 13px/1.2 'Archivo',sans-serif;color:#1a1a1a}
.dv-group{font:700 11px 'Archivo',sans-serif;letter-spacing:.14em;color:#6b6764;margin:34px 0 14px;border-top:1px solid rgba(0,0,0,.10);padding-top:10px;text-transform:uppercase}
.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}
.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.1);color:#1a1a1a;text-decoration:none}
.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'Archivo',sans-serif;color:rgba(0,0,0,.6)}
.dv-card{max-width:100%;background:#fff;border:1px solid rgba(0,0,0,.14);overflow:hidden}
.dv-opt:target .dv-oid{background:#1560ec;color:#fff}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.dv-card a{text-decoration:none}
:root{--color-accent:#1560ec;--color-accent-100:oklch(.95 .03 258);--color-accent-200:oklch(.9 .06 258);--color-accent-300:oklch(.82 .1 258);--color-accent-400:oklch(.68 .16 258);--color-accent-500:#1560ec;--color-accent-600:oklch(.5 .19 258);--color-accent-700:#0b3fa1;--color-accent-800:oklch(.32 .13 258);--color-accent-900:oklch(.25 .1 258)}
.dv-card table.table th{height:40px;padding-top:0;padding-bottom:0;vertical-align:middle;font-size:11px}
.dv-card table.table td{height:52px;padding:8px 12px;vertical-align:middle;font-size:14px}
.dv-card input.input{height:36px;box-sizing:border-box}
.btn-primary{background:#1560ec;border-color:#1560ec;color:#fff}
.btn-primary:hover{background:#0d3fa3}
.btn-primary:active{background:#0b3487}
.input,textarea.input{border-color:#726d6c}
</style>
</head>
<body style="padding:24px">
<div class="dv-opt" id="1h"><div class="dv-olabel"><a class="dv-oid" href="#1h">1h</a>Login — com link "Esqueci minha senha" (18a)</div>
<div class="dv-card" style="width:1400px;height:760px;background:var(--color-bg,#f3f2f2);display:flex">
  <div style="width:560px;background:#1560ec;color:#fff;padding:52px 48px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:12px"><img src="../../uploads/zataco-wordmark-white.svg" style="height:20px;display:block" alt="ZATACO"></div>
    <div style="font:700 40px/1.15 'Archivo';letter-spacing:-.01em;max-width:420px">Gestão de linhas de produção para fábricas.</div>
    <div class="mono" style="font-size:12px;opacity:.85">brindes-caico.zataco.com</div>
  </div>
  <div style="flex:1;padding:48px 44px;display:flex;flex-direction:column;gap:18px;justify-content:center;align-items:center"><div style="width:380px;display:flex;flex-direction:column;gap:18px">
    <div><div style="font:700 24px 'Archivo';color:#201e1d">Brindes Caicó</div><div style="font:500 15px 'Archivo';color:#6b6764;margin-top:4px">Entre com a conta do seu perfil</div></div>
    <div style="display:flex;flex-direction:column;gap:6px"><label style="font:600 12px 'Archivo';letter-spacing:.06em;color:#201e1d">E-MAIL</label><input class="input" value="marina@brindescaico.com" style="width:100%"></div>
    <div style="display:flex;flex-direction:column;gap:6px"><label style="font:600 12px 'Archivo';letter-spacing:.06em;color:#201e1d">SENHA</label><input class="input" type="password" value="senhasegura" style="width:100%"><a style="font:600 12.5px 'Archivo';align-self:flex-start;margin-top:8px">Esqueci minha senha</a></div>
    <div style="background:oklch(.95 .06 25);border:1px solid oklch(.6 .18 25);padding:10px 14px;font:600 12px 'Archivo';color:oklch(.42 .16 25)">Sua senha provisória expirou — peça um novo convite ao administrador.</div>
    <button class="btn btn-primary btn-block">Entrar</button>
    </div>
  </div>
</div></div>
</body>
</html>
